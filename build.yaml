---
include:
  # Left half (central). Vendor ships only the Studio build for this side.
  - board: nice_nano_v2
    shield: eyelash_corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left

  # Right half (peripheral).
  - board: nice_nano_v2
    shield: eyelash_corne_right
    artifact-name: eyelash_corne_right

  # Erases the NVS settings partition. Flash, let it boot, then reflash
  # the real firmware. Wipes BT pairings.
  - board: nice_nano_v2
    shield: settings_reset

  # Console over USB CDC ACM. Read with: cat /dev/cu.usbmodem*
  # Keep this - it is what identified the display fault.
  - board: nice_nano_v2
    shield: eyelash_corne_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_DISPLAY_LOG_LEVEL_DBG=y -DCONFIG_ZMK_LOG_LEVEL_DBG=y
    artifact-name: eyelash_corne_logging_left

  # Console over USB CDC ACM for the peripheral. The right half is where the
  # cat and the relayed WPM live, so it needs its own console build.
  - board: nice_nano_v2
    shield: eyelash_corne_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_DISPLAY_LOG_LEVEL_DBG=y -DCONFIG_ZMK_LOG_LEVEL_DBG=y
    artifact-name: eyelash_corne_logging_right
